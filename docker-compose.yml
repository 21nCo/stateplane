services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: stateplane
      POSTGRES_PASSWORD: local-only-stateplane
      POSTGRES_DB: stateplane
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stateplane -d stateplane"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - stateplane_pg:/var/lib/postgresql/data
volumes:
  stateplane_pg:
