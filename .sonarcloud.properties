# PostgreSQL CHECK expressions compare text to the empty string. The PL/SQL
# NullComparison rule misreads those literals as SQL NULL; changing the applied
# migration files would also invalidate their recorded SHA-256 checksums.
sonar.issue.ignore.multicriteria=emptyCheckOwnedSpaces,emptyCheckIssuances
sonar.issue.ignore.multicriteria.emptyCheckOwnedSpaces.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.emptyCheckOwnedSpaces.resourceKey=migrations/011_owned_spaces.sql
sonar.issue.ignore.multicriteria.emptyCheckIssuances.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.emptyCheckIssuances.resourceKey=migrations/017_agent_key_issuances.sql
