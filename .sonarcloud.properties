# PostgreSQL distinguishes empty text from NULL. SonarCloud Automatic Analysis
# uses the project's Analysis Scope setting, not this repository file. Mirror
# its rule-specific exclusions here for scanner-driven analysis; preserve all
# three effective project entries when changing that setting.
sonar.issue.ignore.multicriteria=ownedSpaceEmpty,agentKeyEmpty,homeCellEmpty
sonar.issue.ignore.multicriteria.ownedSpaceEmpty.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.ownedSpaceEmpty.resourceKey=migrations/011_owned_spaces.sql
sonar.issue.ignore.multicriteria.agentKeyEmpty.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.agentKeyEmpty.resourceKey=migrations/017_agent_key_issuances.sql
sonar.issue.ignore.multicriteria.homeCellEmpty.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.homeCellEmpty.resourceKey=migrations/025_space_directory_home_cell.sql
